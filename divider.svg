<svg width="100%" height="8" viewBox="0 0 1000 8" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0011" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2e88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0011" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="3s" repeatCount="indefinite"/>
