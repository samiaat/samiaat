<svg width="100%" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a0018"/>
      <stop offset="100%" stop-color="#0a0006"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="50%" stop-color="#ffb3dc"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#ff2e88">
    <circle cx="70" cy="230" r="3">
      <animate attributeName="cy" values="230;20;230" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="240" r="2.5">
      <animate attributeName="cy" values="240;15;240" dur="7s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="420" cy="225" r="3.5">
      <animate attributeName="cy" values="225;10;225" dur="5.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="620" cy="235" r="2">
      <animate attributeName="cy" values="235;25;235" dur="6.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="780" cy="245" r="3">
      <animate attributeName="cy" values="245;20;245" dur="7.5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="850" cy="220" r="2.5">
      <animate attributeName="cy" values="220;30;220" dur="6.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>

  <!-- glow layer behind title -->
  <text x="450" y="125" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="56" font-weight="bold" fill="url(#glow)" filter="url(#blur)" opacity="0.75">SAMIA ATMANI</text>

  <!-- crisp title with pulsing glow -->
  <text x="450" y="125" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">
    SAMIA ATMANI
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="168" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="19" fill="#ffb3dc">
    Data Science &#183; Machine Learning &#183; Full-Stack Engineering
  </text>

  <!-- animated underline that draws itself -->
  <rect x="450" y="188" width="0" height="3" fill="#ff2e88" rx="2">
    <animate attributeName="width" values="0;320" dur="1.4s" begin="0.3s" fill="freeze"/>
    <animate attributeName="x" values="450;290" dur="1.4s" begin="0.3s" fill="freeze"/>
  </rect>
</svg>
